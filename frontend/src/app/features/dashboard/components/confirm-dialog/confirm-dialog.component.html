<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">
    {{ data.cancelLabel ?? 'Cancel' }}
  </button>
  <button mat-flat-button class="confirm-delete" type="button" (click)="confirm()">
    {{ data.confirmLabel ?? 'Delete' }}
  </button>
</mat-dialog-actions>
