<mat-card class="graph-item-card" appearance="outlined">
  <mat-card-header>
    <mat-card-title>{{ graphItem().name }}</mat-card-title>
    <mat-card-subtitle>{{ graphItem().description }}</mat-card-subtitle>
  </mat-card-header>
  <mat-card-content>
    <dl class="meta">
      <dt>Graph Type</dt>
      <dd>{{ graphItem().graphType.technicalName }}</dd>
      <dt>Data Type</dt>
      <dd>{{ graphItem().graphDataType.technicalName }}</dd>
    </dl>
  </mat-card-content>
</mat-card>
