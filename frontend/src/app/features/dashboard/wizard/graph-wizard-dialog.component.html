<h2 mat-dialog-title>Create a new graph</h2>

<mat-dialog-content class="wizard-content">
  @switch (step()) {
    @case (1) {
      <app-select-data-step
        [selected]="state.selectedGraphDataType()"
        (selectedChange)="state.setGraphDataType($event)"
      />
    }
    @case (2) {
      <app-select-graph-type-step
        [selectedGraphDataType]="state.selectedGraphDataType()"
        [selected]="state.selectedGraphType()"
        (selectedChange)="state.setGraphType($event)"
      />
    }
    @case (3) {
      <app-configure-graph-step />
    }
    @default {
      <app-review-graph-step />
    }
  }

  @if (createError(); as error) {
    <p class="create-error" role="alert">{{ error }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (step() === 1) {
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button
      mat-flat-button
      type="button"
      [disabled]="state.selectedGraphDataType() === null"
      (click)="continue()"
    >
      Next
    </button>
  } @else {
    <button mat-button type="button" [disabled]="isCreating()" (click)="goBack()">Back</button>
    @if (step() === 4) {
      <button
        mat-flat-button
        type="button"
        [disabled]="isCreating()"
        (click)="createGraph()"
      >
        {{ isCreating() ? 'Creating…' : 'Create Graph' }}
      </button>
    } @else {
      <button mat-flat-button type="button" [disabled]="nextDisabled()" (click)="continue()">
        Next
      </button>
    }
  }
</mat-dialog-actions>
