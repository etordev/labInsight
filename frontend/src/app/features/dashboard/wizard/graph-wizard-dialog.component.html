<h2 mat-dialog-title class="wizard-title">
  <span>{{ state.isEditing() ? 'Edit graph' : 'Create a new graph' }}</span>
  <button
    mat-icon-button
    class="close-button"
    type="button"
    aria-label="Close"
    [disabled]="isSaving()"
    (click)="close()"
  >
    <mat-icon>close</mat-icon>
  </button>
</h2>

<mat-dialog-content class="wizard-content">
  @switch (step()) {
    @case (1) {
      <app-select-data-step
        [selected]="state.selectedGraphDataType()"
        (selectedChange)="state.setGraphDataType($event)"
      />
    }
    @case (2) {
      <app-select-graph-type-step
        [selectedGraphDataType]="state.selectedGraphDataType()"
        [selected]="state.selectedGraphType()"
        (selectedChange)="state.setGraphType($event)"
      />
    }
    @case (3) {
      <app-configure-graph-step />
    }
    @default {
      <app-review-graph-step />
    }
  }

  @if (saveError(); as error) {
    <p class="create-error" role="alert">{{ error }}</p>
  }
</mat-dialog-content>

<mat-dialog-actions class="wizard-actions">
  @if (state.isEditing()) {
    <button
      mat-button
      class="delete-action"
      type="button"
      [disabled]="isSaving()"
      (click)="requestDelete()"
    >
      Delete graph
    </button>
  }

  <div class="wizard-actions-end">
    @if (step() === 1) {
      <button mat-button type="button" [disabled]="isSaving()" (click)="close()">Cancel</button>
      <button
        mat-flat-button
        type="button"
        [disabled]="state.selectedGraphDataType() === null || isSaving()"
        (click)="continue()"
      >
        Next
      </button>
    } @else {
      <button mat-button type="button" [disabled]="isSaving()" (click)="goBack()">Back</button>
      @if (step() === 4) {
        <button mat-flat-button type="button" [disabled]="isSaving()" (click)="saveGraph()">
          @if (isSaving()) {
            {{ state.isEditing() ? 'Saving…' : 'Creating…' }}
          } @else if (state.isEditing()) {
            Save changes
          } @else {
            Create Graph
          }
        </button>
      } @else {
        <button
          mat-flat-button
          type="button"
          [disabled]="nextDisabled() || isSaving()"
          (click)="continue()"
        >
          Next
        </button>
      }
    }
  </div>
</mat-dialog-actions>
