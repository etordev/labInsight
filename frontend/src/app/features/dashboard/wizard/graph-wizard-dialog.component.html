<h2 mat-dialog-title>Create a new graph</h2>

<mat-dialog-content class="wizard-content">
  @switch (step()) {
    @case (1) {
      <app-select-data-step
        [selected]="state.selectedGraphDataType()"
        (selectedChange)="state.setGraphDataType($event)"
      />
    }
    @case (2) {
      <app-select-graph-type-step
        [selectedGraphDataType]="state.selectedGraphDataType()"
        [selected]="state.selectedGraphType()"
        (selectedChange)="state.setGraphType($event)"
      />
    }
    @default {
      <section class="step-placeholder" aria-labelledby="configure-graph-title">
        <h3 id="configure-graph-title">Configure graph</h3>
        <p>Graph configuration will be added in the next step.</p>
      </section>
    }
  }
</mat-dialog-content>

<mat-dialog-actions align="end">
  @if (step() === 1) {
    <button mat-button type="button" (click)="close()">Cancel</button>
    <button
      mat-flat-button
      type="button"
      [disabled]="state.selectedGraphDataType() === null"
      (click)="continue()"
    >
      Next
    </button>
  } @else {
    <button mat-button type="button" (click)="goBack()">Back</button>
    <button
      mat-flat-button
      type="button"
      [disabled]="step() !== 2 || state.selectedGraphType() === null"
      (click)="continue()"
    >
      Next
    </button>
  }
</mat-dialog-actions>
