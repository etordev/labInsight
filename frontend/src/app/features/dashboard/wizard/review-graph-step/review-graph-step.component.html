<section class="wizard-step">
  <header class="wizard-step-heading">
    <h3 id="review-graph-title">Review</h3>
    <p id="review-graph-subtitle">Review your graph configuration before creating it.</p>
  </header>

  <dl class="review-list">
    @for (row of rows(); track row.label) {
      <div class="review-row">
        <dt>{{ row.label }}</dt>
        <dd>{{ row.value }}</dd>
      </div>
    }
  </dl>
</section>
