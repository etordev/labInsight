<section class="wizard-step">
  <header class="wizard-step-heading">
    <h3 id="select-visualization-type-title">Select Visualization Type</h3>
    <p id="select-visualization-type-subtitle">Choose how you want to visualize the selected data.</p>
    <app-wizard-selection-summary />
  </header>

  <div
    class="wizard-option-grid"
    role="radiogroup"
    aria-labelledby="select-visualization-type-title"
    aria-describedby="select-visualization-type-subtitle"
  >
    @for (option of options(); track option.technicalName) {
      <button
        type="button"
        class="wizard-option-card"
        role="radio"
        [class.selected]="selected() === option.technicalName"
        [attr.aria-checked]="selected() === option.technicalName"
        (click)="select(option.technicalName)"
        (keydown)="onCardKeydown($event, option.technicalName)"
      >
        <mat-icon class="wizard-option-icon" aria-hidden="true">{{ option.icon }}</mat-icon>
        <span class="wizard-option-copy">
          <span class="wizard-option-label">{{ option.label }}</span>
          <span class="wizard-option-description">{{ option.description }}</span>
        </span>
      </button>
    }
  </div>
</section>
