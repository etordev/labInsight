<section class="select-data">
  <header class="select-data-heading">
    <h3 id="select-data-title">Select Data</h3>
    <p id="select-data-subtitle">Choose the laboratory information you want to analyze.</p>
  </header>

  <div
    class="data-type-grid"
    role="radiogroup"
    aria-labelledby="select-data-title"
    aria-describedby="select-data-subtitle"
  >
    @for (option of options; track option.technicalName) {
      <button
        type="button"
        class="data-type-card"
        role="radio"
        [class.selected]="selected() === option.technicalName"
        [attr.aria-checked]="selected() === option.technicalName"
        (click)="select(option.technicalName)"
        (keydown)="onCardKeydown($event, option.technicalName)"
      >
        <mat-icon class="data-type-icon" aria-hidden="true">{{ option.icon }}</mat-icon>
        <span class="data-type-copy">
          <span class="data-type-label">{{ option.label }}</span>
          <span class="data-type-description">{{ option.description }}</span>
        </span>
      </button>
    }
  </div>
</section>
